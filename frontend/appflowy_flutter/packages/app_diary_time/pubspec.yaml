name: app_diary_time
description: AppFlowy 二次开发扩展包 —— 时间日记体系（月历回溯、每日日记、生活元数据块）
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.4"

dependencies:
  flutter:
    sdk: flutter
  app_biz_store:
    path: ../app_biz_store
  appflowy_backend:
    path: ../appflowy_backend
  appflowy_result:
    path: ../appflowy_result
  # 自定义块需要编辑器节点/构建器 API（与 App 侧 dependency_overrides 的同一 git 版本）
  appflowy_editor:
    git:
      url: https://github.com/AppFlowy-IO/appflowy-editor.git
      ref: "470c4e7"
  provider: ^6.1.1
